[project]
name = "speaker"
version = "0.0.1"
description = "Local-first Orpheus TTS for English and German, with Groq and macOS say fallbacks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kolja" }]
keywords = ["tts", "orpheus", "speech", "local", "groq"]
dependencies = [
  "groq>=1.6.0",
  "huggingface-hub>=0.20.0",
  "langdetect>=1.0.9",
  "numpy>=2.4.6",
  "onnxruntime>=1.27.0",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
]

[project.scripts]
speaker = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "local_orpheus.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "tests"]
extend-exclude = ["Orpheus-TTS", ".venv"]

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "B", # bugbear
  "SIM", # simplify
  "RUF", # ruff
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["local_orpheus", "main"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-q",
  "--strict-markers",
  "--cov=main",
  "--cov=local_orpheus",
  "--cov-report=term-missing",
  "--cov-fail-under=40",
]
markers = [
  "integration: needs models / network / audio hardware",
]

[tool.coverage.run]
omit = ["tests/*", "Orpheus-TTS/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["Orpheus-TTS/", ".venv/"]
files = ["main.py", "local_orpheus.py", "tests"]
